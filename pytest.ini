[pytest]
# The tests import the integration as `custom_components.waste_collection_schedule.*`,
# which needs the repository root on sys.path. `python -m pytest` adds the working
# directory for you; the bare `pytest` console script (what CI runs) does not, so
# make it explicit. Path is relative to rootdir.
pythonpath = .
filterwarnings = ignore:.*:DeprecationWarning
python_files = test_*.py
testpaths = tests
