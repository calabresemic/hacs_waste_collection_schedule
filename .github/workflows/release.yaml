---
name: Publish release

# Pushing a tag like v2.34.0 publishes the matching GitHub release, which is
# what HACS actually reads (it calls the releases API - a bare tag is invisible
# to it, and drafts are skipped silently).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish a release for (e.g. v2.34.0)
        required: true

permissions:
  contents: write

jobs:
  check:
    name: Check tag against manifest
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve tag
        id: tag
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          # A tag with a hyphen (v2.34.0-beta.1) is a prerelease: HACS hides
          # those unless "show beta versions" is enabled for the repository.
          case "$tag" in
            *-*) echo "prerelease=true" >>"$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >>"$GITHUB_OUTPUT" ;;
          esac

      # HACS shows the release tag while Home Assistant reads manifest.json.
      # If they drift, HACS offers an update that installs the same version
      # forever, so treat a mismatch as a hard failure.
      - name: Verify manifest version matches the tag
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          manifest=$(jq -r .version \
            custom_components/waste_collection_schedule/manifest.json)
          echo "tag=$tag manifest=$manifest"
          if [ "${tag#v}" != "$manifest" ]; then
            echo "::error::Tag $tag does not match manifest.json version $manifest - bump the manifest, or retag."
            exit 1
          fi

  test:
    name: Test
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.check.outputs.tag }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Import the integration
        run: python -c "from custom_components.waste_collection_schedule import config_flow"
      - name: Test
        run: pytest

  publish:
    name: Publish
    needs: [check, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.check.outputs.tag }}
          fetch-depth: 0

      # --generate-notes fills the body from the commits since the previous
      # release. --verify-tag refuses to invent a tag that isn't pushed.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - nothing to do."
            exit 0
          fi
          flags=""
          if [ "$PRERELEASE" = "true" ]; then
            flags="--prerelease"
          fi
          # shellcheck disable=SC2086
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag $flags