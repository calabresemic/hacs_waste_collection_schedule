---
name: Validate Waste Collection Schedule

# The single definition of "tested" for this repository. Runs on its own for
# pushes and PRs, and is called by release.yaml so a tag is gated on exactly
# the same checks rather than a second, drifting copy of them.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: validate (${{ matrix.lane }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Proves the `homeassistant: 2024.4.0` floor advertised in hacs.json
          # is real. HA 2024.4 needs Python 3.12.
          - lane: minimum
            python_version: '3.12'
            homeassistant_spec: homeassistant==2024.4.0
            josepy_spec: josepy<2
          - lane: current
            python_version: '3.14'
            homeassistant_spec: homeassistant
            josepy_spec: josepy

    steps:
      # On a tag build (called from release.yaml) this checks out the tag,
      # because the called workflow inherits the caller's ref.
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest -r requirements.txt "${{ matrix.homeassistant_spec }}" "${{ matrix.josepy_spec }}"

      # The full rule set from ruff.toml, not just syntax errors and undefined
      # names - otherwise a lint failure only surfaces at tag time.
      - name: Lint
        run: ruff check . --output-format=full

      - name: Import the integration
        run: python -c "from custom_components.waste_collection_schedule import config_flow"

      - name: Test
        run: pytest