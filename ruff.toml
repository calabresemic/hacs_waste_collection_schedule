# Mirrors the upstream configuration, minus the exemptions that only existed
# because of the 950 community source modules this fork no longer carries.
target-version = "py310"
line-length = 88

[lint]
select = ["E", "F", "W", "I", "B", "C4", "PIE", "RUF", "UP", "ISC", "RET"]
ignore = ["E203", "E501", "E721", "RET503", "RET504"]

[format]
quote-style = "double"
indent-style = "space"
